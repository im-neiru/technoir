[workspace]
members = ["app", "engine", "ui", "wallpapers/*"]
resolver = "3"

[workspace.dependencies]
bytemuck = "1.25.0"
ciborium = "0.2.2"
crossbeam-queue = "0.3.12"
glam = { version = "0.32.1", features = ["bytemuck", "fast-math", "rand"] }
glyphon = "0.11.0"
image = "0.25.10"
indexmap = "2.14.0"
rand = "0.10.1"
rapidhash = "4.4.1"
raw-window-handle = "0.6.2"
rustfft = "6.4.1"
smol = "2.0.2"
wasapi = "0.23.0"
thiserror = "2.0.18"
naga = { version = "29.0.1", features = ["serialize", "deserialize"] }
wgpu = { version = "29.0.1", features = ["naga-ir"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
