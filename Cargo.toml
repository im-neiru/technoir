[workspace]
members = ["app", "engine", "ui", "wallpapers/*"]
resolver = "3"

[workspace.dependencies]
bytemuck = "1.25.0"
ciborium = "0.2.2"
crossbeam-queue = "0.3.12"
chrono = "0.4.45"
glam = { version = "0.33.7", features = ["bytemuck", "fast-math", "rand"] }
glyphon = "0.12.0"
image = "0.25.10"
indexmap = "2.14.0"
rand = "0.10.2"
rapidhash = "4.4.1"
raw-window-handle = "0.6.2"
rustfft = "6.4.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
smol = "2.0.2"
thiserror = "2.0.18"
toml = "1.1.6"
wasapi = "0.24.0"
mlua = { version = "0.12.1", default-features = false, features = [
    "luau-jit",
    "luau-vector4",
] }
cbor2 = "1.1"
naga = { version = "30.0.1", features = [
    "serialize",
    "deserialize",
    "wgsl-in",
    "wgsl-out",
] }
wgpu = { version = "30.0.1", default-features = false, features = [
    "naga-ir",
    "dx12",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
] }
libloading = "0.9.0"
zip = { version = "8.6.0", default-features = false, features = ["zstd"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
